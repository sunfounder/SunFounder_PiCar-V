[project]
name = "picar-relay"
version = "0.1.0"
description = "Relay server for PiCar-V remote control"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx[socks]>=0.27",
    "pyjwt>=2.9",
    "pydantic-settings>=2.5",
]

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
