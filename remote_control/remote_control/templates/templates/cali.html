{% extends "base.html" %}
{% load static %}

{% block left_button %}
<a href="/run/" class="mui-btn mui-btn--flat mui-btn--small" style="background-color:rgba(0,0,0,0)"><img src="{% static 'back_unpressed.png' %}"></a>
{% endblock %}

{% block page_title %}
Calibration
{% endblock %}

{% block right_button %}
<button class="mui-btn mui-btn--flat mui-btn--small" onmousedown="cali_ok()" style="background-color:rgba(0,0,0,0)"><div class="mui--text-headline mui--text-light">OK</div></button>
{% endblock %}

{% block content %}
  <script type="text/javascript">
    function getCSRFToken() {
      var m = document.cookie.match(/csrftoken=([^;]+)/);
      return m ? m[1] : '';
    }

    function run_action(value) {
      fetch('/api/cali/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'X-CSRFToken': getCSRFToken()
        },
        body: 'action=' + encodeURIComponent(value)
      });
    }

    function cali_ok() {
      run_action('camcaliok');
      run_action('fwcaliok');
      run_action('bwcaliok');
      setTimeout(function() { window.location.href = '/run/'; }, 300);
    }

    // Enter calibration mode on page load.
    run_action('camcali');
    run_action('fwcali');
    run_action('bwcali');
  </script>
  <div class="mui-container-fluid-height mui-container-fluid-line-height">
    <!-- Camera Calibration -->
    <div class="mui-row">
      <div class="mui-col-xs-10 mui-col-sm-10 mui-col-sm-offset-1 mui-col-xs-offset-1" align="left">
        <div class="mui--text-headline mui--text-dark-secondary">
          Camera Calibration:
        </div>
      </div>
    </div>
    <div class="mui-row">
      <div class="mui-col-xs-10 mui-col-sm-10 mui-col-sm-offset-1 mui-col-xs-offset-1" align="center">
        <div class="mui-panel">
          <div class="mui-col-xs-6 mui-col-sm-6" align="center">
          </div>
          <div class="mui-col-xs-6 mui-col-sm-6">
            <div class="mui-row" align="center">
              <button class="mui-btn mui-btn--primary" onmousedown="run_action('camcaliup')">&#9650;</button>
            </div>
            <div class="mui-row">
              <div class="mui-col-xs-4 mui-col-sm-4" align="right">
                <button class="mui-btn mui-btn--primary" onmousedown="run_action('camcalileft')">&#9664;</button>
              </div>
              <div class="mui-col-xs-4 mui-col-sm-4 mui-col-sm-offset-4 mui-col-xs-offset-4" align="left">
                <button class="mui-btn mui-btn--primary" onmousedown="run_action('camcaliright')">&#9654;</button>
              </div>
            </div>
            <div class="mui-row" align="center">
              <button class="mui-btn mui-btn--primary" onmousedown="run_action('camcalidown')">&#9660;</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Front Wheels Calibration -->
    <div class="mui-row">
      <div class="mui-col-xs-10 mui-col-sm-10 mui-col-sm-offset-1 mui-col-xs-offset-1" align="left">
        <div class="mui--text-headline mui--text-dark-secondary">
          Front Wheels Calibration:
        </div>
      </div>
    </div>
    <div class="mui-row">
      <div class="mui-col-xs-10 mui-col-sm-10 mui-col-sm-offset-1 mui-col-xs-offset-1" align="center">
        <div class="mui-panel">
          <div class="mui-col-xs-6 mui-col-sm-6" align="center">
          </div>
          <div class="mui-col-xs-6 mui-col-sm-6">
            <div class="mui-row">
              <div class="mui-col-xs-4 mui-col-sm-4" align="right">
                <button class="mui-btn mui-btn--primary" onmousedown="run_action('fwcalileft')">&#9664;</button>
              </div>
              <div class="mui-col-xs-4 mui-col-sm-4 mui-col-sm-offset-4 mui-col-xs-offset-4" align="left">
                <button class="mui-btn mui-btn--primary" onmousedown="run_action('fwcaliright')">&#9654;</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Rear Wheels Calibration -->
    <div class="mui-row">
      <div class="mui-col-xs-10 mui-col-sm-10 mui-col-sm-offset-1 mui-col-xs-offset-1" align="left">
        <div class="mui--text-headline mui--text-dark-secondary">
          Rear Wheels Calibration:
        </div>
      </div>
    </div>
    <div class="mui-row">
      <div class="mui-col-xs-10 mui-col-sm-10 mui-col-sm-offset-1 mui-col-xs-offset-1" align="center">
        <div class="mui-panel">
          <div class="mui-col-xs-6 mui-col-sm-6" align="center">
          </div>
          <div class="mui-col-xs-6 mui-col-sm-6">
            <div class="mui-row">
              <div class="mui-col-xs-5 mui-col-sm-5" align="right">
                <button class="mui-btn mui-btn--primary" onmousedown="run_action('bwcalileft')">left</button>
              </div>
              <div class="mui-col-xs-5 mui-col-sm-5 mui-col-sm-offset-2 mui-col-xs-offset-2" align="left">
                <button class="mui-btn mui-btn--primary" onmousedown="run_action('bwcaliright')">right</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
